<html lang="ar" dir="rtl">
<head>

<meta name="theme-color" content="#e2492c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<title>تذوق</title>
<style>
:root{--bg:#fbf6f0;--card:#fff;--tx:#241a12;--mut:#8a7a6c;--pri:#e2492c;--pri2:#f6a623;--bd:#efe2d2;--chip:#f7ede0;--star:#e8a317;--glass:rgba(255,255,255,.65);--glow:0 10px 24px rgba(226,73,44,.35);--sh:0 1px 2px #241a120d,0 12px 28px #241a1212;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#140d09;--card:#1f1610;--tx:#f7ede2;--mut:#ab998a;--pri:#ff7a45;--pri2:#ffc266;--bd:#352619;--chip:#2a1d14;--glass:rgba(31,22,16,.55);--glow:0 10px 28px rgba(255,122,69,.45);--sh:none;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",Arial,sans-serif;font-size:15px;max-width:600px;min-height:100vh;margin:auto;padding-bottom:calc(94px + env(safe-area-inset-bottom,0px))}
header{position:relative;overflow:hidden;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px;background:linear-gradient(140deg,var(--pri) 0%,var(--pri2) 100%);color:#fff;border-radius:0 0 30px 30px;box-shadow:var(--sh)}
.blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.5;pointer-events:none;z-index:0}
.b1{width:170px;height:170px;background:#ffe08a;top:-70px;left:-40px}
.b2{width:150px;height:150px;background:#ff5f8a;bottom:-80px;right:-30px}
.topin{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:40px;height:40px;border-radius:13px;background:#ffffff26;backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:21px}
header h1{font-size:24px;font-weight:900;letter-spacing:-.3px}
header p{font-size:13px;opacity:.92;margin-top:6px;font-weight:600;max-width:34ch}
main{padding:10px 16px 6px}
h3{margin:18px 2px 8px;font-size:15px;font-weight:800}
.mut{color:var(--mut);font-size:13px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(94%,560px);display:flex;align-items:center;justify-content:space-around;background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--bd);border-radius:26px;box-shadow:var(--sh);padding:6px;z-index:8}
nav button{background:none;border:0;color:var(--mut);font:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px;border-radius:16px;cursor:pointer;flex:1}
nav button .ic svg{width:20px;height:20px;display:block}
nav button em{font-style:normal;font-size:10.5px;font-weight:700}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--pri),var(--pri2))}
nav .plus{flex:none;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;display:flex;align-items:center;justify-content:center;padding:0;margin:-26px 6px 0;box-shadow:var(--glow);border:0;cursor:pointer}
nav .plus .ic svg{width:25px;height:25px}
input,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;margin:6px 0;outline:none}
input:focus,textarea:focus{border-color:var(--pri)}
.btn{width:100%;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:800;cursor:pointer;margin-top:6px}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;margin:10px 0;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.item:active{transform:scale(.98)}
.img{width:58px;height:58px;border-radius:16px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.rk{font-weight:800;color:var(--pri);width:20px;text-align:center;font-size:14px}
.item>div:last-child{flex:1;min-width:0}
.st{color:var(--star);letter-spacing:1px;font-size:13px;margin-top:3px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:99px;padding:8px 15px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
#sheet{position:fixed;inset:0;background:#1a120e80;display:none;align-items:flex-end;justify-content:center;z-index:9}
#sheet.show{display:flex}
#box{background:var(--bg);width:100%;max-width:600px;max-height:90%;overflow-y:auto;border-radius:26px 26px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom,0px));position:relative}
.x{position:absolute;top:14px;left:14px;background:var(--chip);border:0;color:var(--mut);width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer}
.hero{height:140px;border-radius:20px;background:linear-gradient(135deg,var(--chip),var(--bd));display:flex;align-items:center;justify-content:center;font-size:66px;margin-bottom:12px}
.cm{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin:10px 0}
.stars button{background:none;border:0;font-size:24px;color:var(--star);cursor:pointer;padding:0 2px}
.rate{display:flex;justify-content:space-between;align-items:center;padding:4px 0}
svg.map{width:100%;background:var(--chip);border-radius:20px}
</style>
</head>

 <div class="blob b1"></div><div class="blob b2"></div>

  list=R.filter(r=>r.r.includes(road))}
 if(hid&&!list.find(r=>r.id==hid))list.push(R.find(r=>r.id==hid));
 list.forEach(r=>{const [x,y]=pp(RP[r.id]);const h=r.id==hid;g+=`<g onclick="openR(${r.id})" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${h?13:9}" fill="${h?"var(--pri)":"var(--card)"}" stroke="var(--pri)" stroke-width="2"/><text x="${x}" y="${+y+(h?5:4)}" text-anchor="middle" font-size="${h?14:11}">${r.e}</text>${h?`<text x="${x}" y="${+y-17}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--pri)">${r.n}</text>`:""}</g>`});
 return `<svg class="map" viewBox="0 0 300 300">${g}</svg>`;
}

function render(){
 const m=$("m");
 if(tab=="home"){
  const l=sortR(R.filter(r=>r.g==gov));
  const ar=AR[gov]||[];if(!ar.includes(area))area=ar.find(a=>R.some(r=>r.g==gov&&r.a==a))||ar[0]||"";
  const la=sortR(R.filter(r=>r.g==gov&&r.a==area));
  m.innerHTML=`<h3>📍 أفضل المطاعم في منطقتك</h3>${chips(ar,area,"setA")}`+(la.length?la.map((r,i)=>row(r,i)).join(""):'<p class="mut">لا توجد مطاعم في هذه المنطقة بعد.</p>')+`<h3>🏙️ أفضل المطاعم في محافظتك</h3>${chips(G,gov,"setG")}`+(l.length?l.map((r,i)=>row(r,i)).join(""):'<p class="mut">لا توجد مطاعم مضافة في هذه المحافظة بعد.</p>');
 }
 if(tab=="map"){
  const P=IQ;
  const dots=G.map(g=>{const [x,y]=pp(C[g]);const n=R.filter(r=>r.g==g).length;return `<g onclick="mapSel('${g}')" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="11" fill="var(--pri)"/><text x="${x}" y="${+y+4}" text-anchor="middle" font-size="11" fill="#fff">${n}</text><text x="${x}" y="${+y-15}" text-anchor="middle" font-size="11" fill="var(--tx)">${g}</text></g>`}).join("");
  m.innerHTML=`<h3>خريطة العراق</h3><svg class="map" viewBox="0 0 300 300"><polygon points="${P.map(p=>pp(p).join(",")).join(" ")}" fill="var(--card)" stroke="var(--bd)" stroke-width="2"/>${dots}</svg><p class="mut" style="margin-top:6px">اضغط على المحافظة لعرض مطاعمها.</p><div id="ml"></div>`;
  mapSel(gov);
 }
 if(tab=="roads"){
  const l=sortR(R.filter(r=>r.r.includes(road)));
  m.innerHTML=`<h3>الطرق الدولية</h3>${chips(ROADS,road,"setRd")}${mapSVG(road,0)}<p class="mut" style="margin:8px 0">مطاعم طريق ${road}:</p>`+(l.length?l.map((r,i)=>row(r,i)).join(""):'<p class="mut">لا توجد مطاعم على هذا الطريق بعد.</p>');
 }
 if(tab=="about"){
  m.innerHTML=`<h3>حول تذوق</h3><div class="cm">تطبيق يجمع مطاعم العراق على الخريطة، ويرتّبها حسب تقييمات الزبائن. هذه نسخة تجريبية ببيانات وهمية.</div><div class="cm"><b>للدعم والمساعدة</b><div class="mut">قسم الدعم سيُضاف في النسخة الأصلية.</div></div><button class="btn" onclick="if(confirm('مسح كل التقييمات؟')){rev={};save();render()}">مسح التقييمات التجريبية</button>`;
 }
 $("nav").innerHTML=[["home",ICON.home,"الرئيسية"],["map",ICON.pin,"الخريطة"],["trip","",""],["roads",ICON.road,"الطرق"],["about",ICON.info,"حول"]].map(t=>t[0]=="trip"?`<button class="plus" onclick="trip()" aria-label="إضافة رحلة جديدة"><span class="ic">${ICON.plus}</span></button>`:`<button class="${tab==t[0]?"on":""}" onclick="go('${t[0]}')"><span class="ic">${t[1]}</span><em>${t[2]}</em></button>`).join("");
}
function go(t){tab=t;render();window.scrollTo(0,0)}
function setG(g){gov=g;area="";render()}
function setA(a){area=a;render()}
function setRd(r){road=r;render()}
function mapSel(g){gov=g;const l=sortR(R.filter(r=>r.g==g));const e=$("ml");if(e)e.innerHTML=`<h3>مطاعم ${g}</h3>`+(l.length?l.map(r=>row(r)).join(""):'<p class="mut">لا توجد مطاعم بعد.</p>')}
function sheet(h){$("box").innerHTML=`<button class="x" onclick="closeS()">✕</button>`+h;$("sheet").classList.add("show")}
function closeS(){$("sheet").classList.remove("show");render()}
$("sheet").addEventListener("click",e=>{if(e.target.id=="sheet")closeS()});
function trip(){sheet(`<h3>رحلة جديدة</h3><p class="mut">اكتب المحافظة أو المنطقة التي ستسافر إليها</p><input id="tq" placeholder="مثال: الموصل، البصرة، عنكاوة"><button class="btn" onclick="doTrip()">بحث</button><div id="tr"></div>`)}
function doTrip(){
 const v=$("tq").value.trim();if(!v)return;
 const l=sortR(R.filter(r=>r.g.includes(v)||r.a.includes(v)||v.includes(r.g))).slice(0,10);
 $("tr").innerHTML=l.length?`<h3>أفضل ${l.length} مطاعم في ${esc(v)}</h3>`+l.map((r,i)=>row(r,i)).join(""):`<p class="mut">لم نجد مطاعم لهذه الوجهة.</p>`;
}
function openR(id){
 const r=R.find(x=>x.id==id),a=avg(r),L=rev[id]||[];
 window._k={};
 sheet(`<div class="hero">${r.e}</div><h3 style="font-size:21px">${r.n}</h3><div class="mut">${r.d} • ${r.a}، ${r.g}</div><div class="st" style="margin:8px 0">${L.length?stars(a)+" "+a.toFixed(1)+` (${L.length} تقييم)`:"لا توجد تقييمات بعد"}</div>${L.length?catAvg(L):""}
 <h3>الموقع على الخريطة</h3>${mapSVG(r.r[0]||null,id)}<h3>قيّم المطعم</h3><div id="sbx" class="cm">${CATS.map(([k,n])=>`<div class="rate"><span>${n}</span><span class="stars" id="sb_${k}">${[1,2,3,4,5].map(i=>`<button onclick="setS('${k}',${i})">☆</button>`).join("")}</span></div>`).join("")}</div>
 <input id="cn" placeholder="اسمك"><textarea id="ct" rows="2" placeholder="اكتب تعليقك"></textarea><button class="btn" onclick="addC(${id})">إرسال</button>
 <h3>تعليقات الزبائن</h3>${L.length?L.slice().reverse().map(c=>`<div class="cm"><b>${esc(c.n||"زائر")}</b> <span class="st">${stars(c.s)}</span> <span class="mut">${c.s.toFixed(1)}</span><div style="margin:6px 0">${esc(c.t)||'<span class="mut">بدون تعليق</span>'}</div>${c.k?`<div class="mut" style="border-top:1px solid var(--bd);padding-top:6px;margin-top:6px">${CATS.map(([k,n])=>`<div class="rate" style="padding:2px 0"><span>${n}</span><span class="st" style="margin:0">${stars(c.k[k])}</span></div>`).join("")}</div>`:""}</div>`).join(""):'<p class="mut">كن أول من يعلّق.</p>'}`);
}
function catAvg(L){return `<div class="mut" style="line-height:1.9">`+CATS.map(([k,n])=>{const v=L.filter(x=>x.k).map(x=>x.k[k]);return v.length?`${n}: ${(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1)}★`:""}).filter(Boolean).join(" • ")+`</div>`}
function setS(k,i){(window._k=window._k||{})[k]=i;[...$("sb_"+k).children].forEach((b,j)=>b.textContent=j<i?"★":"☆")}
function addC(id){
 const K=window._k||{};if(CATS.some(([k])=>!K[k])){alert("قيّم الخانات الأربع أولاً");return}
 const ov=CATS.reduce((a,[k])=>a+K[k],0)/4;
 (rev[id]=rev[id]||[]).push({n:$("cn").value.trim(),t:$("ct").value.trim(),s:ov,k:K});save();openR(id);
}
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2;
function locate(){
 try{
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{
   const me=[p.coords.longitude,p.coords.latitude];
   if(me[0]<38.8||me[0]>48.8||me[1]<29||me[1]>37.5){$("m").insertAdjacentHTML("afterbegin",'<div class="cm">موقعك خارج العراق، لذلك عرضنا بغداد كبداية.</div>');return}
   gov=G.slice().sort((a,b)=>d2(me,C[a])-d2(me,C[b]))[0];
   const l=R.filter(r=>r.g==gov).sort((a,b)=>d2(me,RP[a.id])-d2(me,RP[b.id]));
   if(l.length)area=l[0].a;tab="home";render();
   $("m").insertAdjacentHTML("afterbegin",`<div class="cm">📍 تم تحديد موقعك تلقائياً: ${area}، ${gov}</div>`);
  },()=>{},{timeout:10000});
 }catch(e){}
}
render();
locate();
</script>
</body>
</html>
